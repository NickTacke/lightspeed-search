pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,json}"
      exclude:
        - "**/generated/**"
        - "**/route-tree.gen.ts"
        - "**/routeTree.gen.ts"
        - "**/openapi.json"
        - "packages/database/migrations/**"
      run: "bunx biome check --write {staged_files}"
      stage_fixed: true
    typecheck:
      glob: "*.{ts,tsx}"
      run: "bun run typecheck"
